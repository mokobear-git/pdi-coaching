<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDI コーチング練習問題</title>
<style>
:root{
  --bg:#f4f6f1; --card:#fff; --ink:#26302a; --sub:#667267; --line:#dde3d8;
  --accent:#3f8f5b; --accent-d:#2f6f45; --ok:#2e8b57; --ng:#c8453b; --warn:#e9a43a;
  --okbg:#e6f4ea; --ngbg:#fbeae8; --chip:#eef3ea;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1a1f1b; --card:#242b25; --ink:#e9eee9; --sub:#9aa89c; --line:#37423a;
    --accent:#58b377; --accent-d:#7ad096; --okbg:#1f3a28; --ngbg:#43231f; --chip:#2c352e; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:8px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
.sub{color:var(--sub);font-size:.9rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:var(--accent-d)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:2px 12px;font-size:.82rem;color:var(--sub);margin-right:6px}
.scene{background:var(--chip);border-radius:10px;padding:12px 14px;margin:10px 0}
.qlabel{font-weight:700;margin:14px 0 8px}
.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.right{background:var(--okbg);border-color:var(--ok)}
.choice.wrong{background:var(--ngbg);border-color:var(--ng)}
textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical;min-height:90px}
textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.verdict{font-weight:700;margin:6px 0}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.box{border-left:4px solid var(--accent);background:var(--chip);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.box.expl{border-color:var(--warn)}
.pts li{list-style:none;margin:2px 0}
.pts{padding:0;margin:6px 0}
.score{font-size:3rem;font-weight:800;text-align:center;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.mk-ok{color:var(--ok);font-weight:700}.mk-ng{color:var(--ng);font-weight:700}.mk-na{color:var(--sub)}
#over{position:fixed;inset:0;pointer-events:none;display:none;z-index:50}
#congrats{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;background:rgba(0,0,0,.35);backdrop-filter:blur(2px)}
#congrats .pop{background:var(--card);border-radius:22px;padding:32px 40px;text-align:center;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
#congrats .big{font-size:2.6rem;font-weight:800;color:var(--accent)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.flow{font-size:.78rem;color:var(--sub);margin-top:4px}
html{-webkit-text-size-adjust:100%}
button,.choice{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
textarea,select,input{font-size:16px} /* iOSで入力時に拡大されないように */
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(60px,env(safe-area-inset-bottom))}
#congrats .pop{max-width:88vw}
@media (max-width:600px){
  .wrap{padding-top:12px}
  h1{font-size:1.15rem}
  .card{padding:14px;margin:10px 0;border-radius:12px}
  button{padding:13px 14px;min-height:46px}
  .choice{padding:14px;margin:10px 0;line-height:1.55}
  .row>button{flex:1 1 100%}
  .row.nav{justify-content:stretch}
  textarea{min-height:120px}
  .scene{font-size:.95rem}
  table{font-size:.82rem}
  .score{font-size:2.4rem}
  .hint-key{display:none}
  #congrats .pop{padding:24px 20px}
  #congrats .big{font-size:2rem}
}
</style>
</head>
<body>
<canvas id="over"></canvas>
<div id="congrats"><div class="pop"><div style="font-size:3.5rem">🎉</div><div class="big">おめでとう！</div><p id="cmsg"></p><button class="primary" onclick="closeCongrats()">結果を見る</button></div></div>
<div class="wrap" id="app"></div>

<script>
const I = '(椅子|いす|イス)';
const TO_I = 'タイムアウトの' + I;
const PR = '上手|いい|よい|良い|素晴|すばらしい|素敵|すてき|ナイス|よく|すごい|さすが';
const SAY = 'と言って|といって|と言い|と伝え|と話し|伝えて|言って|いって';
const NG_Q = 'ませんか|ましょうか|てくれない|てくれる|かな';

/* 各問題: 場面→セラピストの行動／親の行動（4択）→コーチのセリフ（自由記述）
   act: [正解, 誤答1, 誤答2, 誤答3]   line: null なら4択のみ */
const QS = [
 { node:'基本', scene:'PDIコーチングを始める前に、基本の考え方を確認します。',
   qtext:'PDIコーチの「基本中の基本」はどれ？',
   act:['親の行動をリードし、親の間違いを予測して予防する','親の失敗を見守り、あとでまとめて振り返る','できるだけ口を出さず、親の判断に任せる','子どもの行動をリードして、親には見守ってもらう'],
   actWhy:'基本中の基本は「親の行動をリードし、親の間違いを予測して予防する」。親の失敗は見逃さず、すぐに修正します。',
   line:null},

 { node:'基本', scene:'親が「椅子に連れて行くのが怖い」「うまくできるか不安」と話している。',
   qtext:'セラピストはどうコーチする？',
   act:['タイムアウトを恐れず、自信ある態度で手順をリードして親を支える','親が安心するまでタイムアウトの練習を見送る','不安な気持ちが落ち着くまで何も言わず待つ','「できそうならやってみてください」と親に判断を任せる'],
   actWhy:'コーチの基本の1つは「タイムアウトを恐れないで、自信ある態度で養育者をリードする」こと。コーチが迷うと親も迷います。',
   line:null},

 { node:'基本', scene:'最初のPDIコーチング。子どもに出す命令を、どのレベルから始めるか決める。',
   qtext:'子どもへの命令の難しさは、どう進める？',
   act:['簡単な命令から始めて、少しずつハードルを上げる','最初から難しい命令を出して、従う力を試す','ずっと同じ簡単な命令だけを続ける','子どもの機嫌に合わせて、毎回難しさを変える'],
   actWhy:'命令は簡単なものから始めて、少しずつハードルを上げます。従う経験を積み重ねるためです。',
   line:null},

 { node:'LF（最初の命令）', scene:'PDIコーチ1の最初の命令。親はまだPDIの命令の出し方に慣れていない。',
   qtext:'最初の命令は、セラピストがどうコーチする？',
   act:['セラピストが先にセリフを与え（LF）、簡単な命令をDC（直接的命令）で出してもらう','親が自分で考えた命令を自由に出してもらう','「どんな命令にしますか？」と質問して、様子を見る','難しい命令から出してもらい、スキルを確認する'],
   actWhy:'最初の命令は、セラピストのラインフィーディング（LF：コーチが先立ってセリフをそのまま与える方法）で簡単な命令から。LFでは、IC（間接的命令）ではなくDC（直接的命令）を出します。',
   line:{ ask:'親に最初の命令を言わせるコーチのセリフを書いてください（ブロックの課題）',
     model:'「『赤いブロックを取ってください』と言って下さい。」',
     groups:['ください|下さい|なさい', SAY], ng:NG_Q,
     points:['「〜と言って下さい」と、親が言うセリフをそのまま与える','命令は「〜してください」という直接的な形（DC）'],
     why:'LFは、親が言うセリフをそのまま与える方法です。親に言わせる命令は質問や提案の形ではなく、直接的に（DC）出します。'}},

 { node:'命令へのCLP', scene:'親が「赤いブロックを取ってください」と直接的な命令を出せた。',
   qtext:'セラピストは次に何をする？',
   act:['親の命令をすぐに具体的に褒める（CLP）','子どもが従うまで何も言わず待つ','「もっと大きな声で」と修正を入れる','先にCDIに戻るよう伝える'],
   actWhy:'LFに親が従ったら、必ず随伴的賞賛（CLP/CUP）を与えます。何がよかったかを具体的に伝えます。',
   line:{ ask:'親の命令を褒めるコーチのセリフを書いてください',
     model:'「いい直接的命令です。」',
     groups:['直接的|直接', PR], ng:'',
     points:['「直接的命令」と、何がよかったかを具体的に言う','ほめる言葉（いい／上手／素晴らしい など）'],
     why:'「いい直接的命令です」のように、親の行動の何がよかったのかを具体的に伝えます（具体的賞賛）。'}},

 { node:'LF（子が従う）', scene:'PDIコーチ1（ラインフィーディング：LF）。セラピストが与えたセリフどおりに、親が「赤いブロックを手に渡してください」と命令を出し、セラピストが親の命令を褒めた。その後、子どもはすぐに赤いブロックを渡してくれた。',
   qtext:'ラインフィーディング（LF）でコーチする場合、セラピストはどうコーチする？',
   act:['親が賞賛できるよう、賞賛のセリフを与える（LF）','何も言わず、親が自分で賞賛するのを待つ','子どもに直接「えらいね」と声をかける','次の命令のセリフをすぐに与える'],
   actWhy:'子どもが命令に従ったら、すぐに親が賞賛できるよう、コーチがセリフを与えます。',
   line:{ ask:'親に賞賛を言わせるコーチのセリフを書いてください',
     model:'「『すぐに言うことを聞いてくれてありがとう』と言って下さい。」',
     groups:['ありがとう|すてき|素晴|えらい|上手|助かり','言うこと|聞い|きい|従っ|してくれ|渡して|入れて', SAY], ng:'',
     points:['ほめる・感謝の言葉','「言うことを聞いてくれた」ことに焦点を当てる','「〜と言って下さい」とセリフを与える'],
     why:'賞賛は「命令に従ったこと」に向けます。親が言うセリフをそのまま与えます（LF）。'}},

 { node:'賞賛へのCLP→CDI', scene:'親が子どもに「すぐに言うことを聞いてくれてありがとう！」と賞賛できた。',
   qtext:'セラピストは次に何をする？',
   act:['親の賞賛を具体的に褒め（CLP）、CDIに戻ってもらう','もう一つ、別の命令を出してもらう','特に何も言わず、様子を見る','賞賛の改善点だけを伝える'],
   actWhy:'親が賞賛できたらすぐに褒め、PDIの1セットが終わったらCDI（遊び）に戻ってもらいます。',
   line:{ ask:'親の賞賛を褒めて、CDIに戻るよう伝えるコーチのセリフを書いてください',
     model:'「素晴らしい具体的賞賛です！CDIに戻ってください。」',
     groups:['賞賛|ほめ|褒め', PR, 'CDI|遊び'], ng:'',
     points:['親の賞賛をほめる（具体的賞賛）','ほめる言葉','「CDI（遊び）に戻ってください」と伝える'],
     why:'賞賛ができたことを具体的に褒め、「CDIに戻ってください」と指示します。'}},

 { node:'LF→PSへ', scene:'LFで、親が命令と賞賛をスムーズに出せるようになってきた。',
   qtext:'セラピストは次にどう進める？',
   act:['プロンプティング（PS）に進み、親が自分の言葉で命令を出せるよう促す','LFをずっと続ける','すぐに親のペースの自発的命令に進める','PDIをやめてCDIだけにする'],
   actWhy:'親がLFに従えるようになったらプロンプティング（PS）に進みます。PSに慣れたら自発的命令に進めます。PSは、親が自分の言葉で目標のスキルを出せるよう、促しの言葉かけをする方法です。',
   line:{ ask:'PSで、親に最初の命令を出させるコーチのセリフを書いてください',
     model:'「簡単な命令を一つ出して下さい。」',
     groups:['命令','出して|だして|ください|下さい'], ng:'と言って',
     points:['「命令を出して下さい」と促す（「簡単な命令を一つ」「〜するような命令を」のどちらでもOK）','命令の言葉そのものは与えない'],
     why:'PSでは、命令の言葉そのものは与えず、親が自分の言葉で言えるよう促します。LFのように「〜と言って下さい」とは言いません。'}},

 { node:'5秒→警告（PS）', scene:'親が命令を出した。5秒数えたが、子どもは従い始めない。',
   qtext:'プロンプティング（PS）でコーチする場合、セラピストはどうコーチする？',
   act:['「もし…」と警告の出だしだけを伝え、親が自分の言葉で言えるよう促す（PS）','警告のセリフを最後まで全部与える（LF）','もう一度、命令を出すよう促す','もう5秒待つよう伝える'],
   actWhy:'PSでは「椅子の警告です。もし…」と出だしだけを伝え、続きは親に言ってもらいます。',
   line:{ ask:'5秒経過のあと、警告を促すコーチのセリフを書いてください（PS）',
     model:'「椅子の警告です。もし…」',
     groups:['警告|椅子','もし'], ng:'',
     points:['「椅子の警告」であることを伝える','「もし…」と出だしだけ言う'],
     why:'警告の最初の言葉「もし…」だけを与えて、続きは親が自分で言えるようにします。'}},

 { node:'警告へのCLP', scene:'親が「もし赤いブロックを取らなかったら、ゆうこちゃんはタイムアウトの椅子に行くことになります」と警告を出せた。',
   qtext:'セラピストは次に何をする？',
   act:['警告をすぐ具体的に褒める（CLP）。このあと5秒を数えて待つ','すぐに子どもを椅子に連れて行くよう指示する','もう一度、警告を言い直すよう促す','子どもに従うよう声かけするよう促す'],
   actWhy:'警告が出せたら、すぐに具体的に褒めます。警告の後は子どもが従うか、また5秒待ちます。',
   line:{ ask:'親の警告を褒めるコーチのセリフを書いてください',
     model:'「上手に椅子の警告が出せました。」',
     groups:['警告', PR], ng:'',
     points:['「（椅子の）警告」が出せたことを具体的に言う','ほめる言葉'],
     why:'何がよかったか（警告が出せたこと）を、具体的に伝えます。'}},

 { node:'賞賛の賞賛', scene:'警告のあと、子どもが赤いブロックを渡してくれた。親は「すぐに取ってくれてありがとう。これでおうちの壁が出来ます」と、理由もつけて賞賛できた。',
   qtext:'セラピストは次に何をする？',
   act:['親の賞賛を具体的に褒める。理由（説明）もつけられたことも伝える','「ありがとう」だけで十分と伝える','何も言わず、次の場面に進む','続けて別の命令を出すよう促す'],
   actWhy:'親が賞賛できたら必ず褒めます。賞賛に理由（わかりやすい説明）をつけられたこともよい点です。',
   line:{ ask:'親の賞賛を褒めるコーチのセリフを書いてください',
     model:'「素晴らしい具体的賞賛ですし、わかりやすい説明もつけられていいですね！」',
     groups:['賞賛|ほめ|褒め', PR, '説明|理由'], ng:'',
     points:['「具体的賞賛」ができたことを伝える','ほめる言葉','わかりやすい説明（理由）がつけられたことにも触れる'],
     why:'賞賛の中身（具体的か、説明がついているか）を具体的に伝えると、親は何を続ければよいかがわかります。'}},

 { node:'親のリード', scene:'LFやPSで、親が効果的な命令とPDIの手順を使えるようになってきた。',
   qtext:'セラピストは次にどうコーチする？',
   act:['親のペースで命令を出してもらい、親に多くを任せるコーチングに切り替える','LFを続けて、毎回セリフを与える','命令を出すタイミングをすべてセラピストが決める','PDIをやめてCDIだけにする'],
   actWhy:'親が自分で効果的な命令とPDI手順を出せるようになったら、親に多くを任せるコーチングに切り替えます。命令は30秒〜1分に1回のペースで、PDIとPDIの間はCDIに戻ります。',
   line:null},

 { node:'5秒ルールのCLP', scene:'親が自分のペースで命令を出し、5秒間静かに待ち、子どもが従ったらすぐに具体的な賞賛をした。',
   qtext:'セラピストは次に何をする？',
   act:['賞賛を褒め、5秒ルールが守れたことも伝える','「5秒は短くしましょう」と伝える','子どもが従ったので何も言わない','命令の頻度を増やすよう促す'],
   actWhy:'従ったことへの賞賛と、5秒ルールを守れたことの両方を褒めます。5秒待つのはPDIの大事なスキルです。',
   line:{ ask:'親を褒めるコーチのセリフを書いてください',
     model:'「素晴らしい具体的賞賛です。5秒ルールもばっちりできました！」',
     groups:['賞賛|ほめ|褒め', PR, '5秒|五秒'], ng:'',
     points:['具体的賞賛ができたことを伝える','ほめる言葉','5秒ルールができたことに触れる'],
     why:'うまくできた行動を具体的に（賞賛とともに5秒ルール）褒めると、その行動が増えます。'}},

 { node:'失敗①：質問形', scene:'親が「赤いブロックを取ってくれない？」と、質問の形で命令を出してしまった。',
   qtext:'セラピストはどうコーチする？',
   act:['見逃さず、その場ですぐ直接的命令に修正してもらう','様子を見て、子どもが従ったらそのままにする','次の命令から直せばいいと考えて見守る','セッション終了後にまとめて伝える'],
   actWhy:'PDIでは親の命令の失敗を見逃さず、すぐに修正します。PDIを間違った形で覚えないためです。',
   line:{ ask:'親の命令を修正するコーチのセリフを書いてください',
     model:'「直接的命令にしてください。『赤いブロックを取ってください』と言って下さい。」',
     groups:['ください|下さい', SAY], ng:NG_Q,
     points:['「〜と言って下さい」と、言い直すセリフを与える（LF）','言い直す命令は「〜してください」という直接的な形（「直接的命令にしてください」と言うのは必須ではない）'],
     why:'何が間違いだったか（直接的命令でなかった）を伝え、言い直すセリフをそのまま与えて確実に修正します。'}},

 { node:'失敗②：質問に答える', scene:'親が「そのお花をピンクで塗ってください」と命令した。子どもが「赤じゃダメ？」と聞くと、親は「ピンクだよ」と答えてしまった。',
   qtext:'セラピストはどうコーチする？',
   act:['「命令のあとは子どもの質問に答えない」と伝え、すぐに修正する','質問に答えることは問題ないので、見守る','もっと丁寧に説明して答えるよう促す','子どもが納得するまで答えてよいと伝える'],

   actWhy:'2つ目の命令に従えたら、熱烈で具体的な賞賛を。ここでPDIが終わり、CDI（遊び）に戻ります。',
   line:{ ask:'親に熱烈な賞賛を言わせるコーチのセリフを書いてください',
     model:'「ナイスです。『すぐに言うことを聞いてくれてありがとう！』と言って下さい。」',
     groups:['すぐ', '聞い|きい|従っ|言うこと|してくれて|塗って|くれて', 'ありがとう|すてき|素晴|えらい|上手', SAY + '|賞賛して|褒めて|ほめて'], ng:'',
     points:['「すぐに」従ったことを具体的に','「言うことを聞いてくれて」など、従ったことに焦点を当てる','ほめる・感謝の言葉（ありがとう など）','「〜と言って下さい」または「〜と熱烈に賞賛してください」とセリフを与える'],
     why:'従ったことを具体的にほめると、従う行動が増えます。'}}
];

/* ----- 正規化・判定 ----- */
const norm = s => s.normalize('NFKC').replace(/[\s、。，．,.「」『』！!？?・\[\]［］()（）○〇◯"“”~〜]/g,'');
function judgeLine(l, text){
  const t = norm(text);
  if(!t) return {ok:false,hits:l.groups.map(()=>false),ng:false};
  const hits = l.groups.map(g=>new RegExp(g).test(t));
  const ng = l.ng ? new RegExp(l.ng).test(t) : false;
  return {ok: hits.every(Boolean) && !ng, hits, ng};
}
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };

/* ----- 状態 ----- */
/* 具体的な命令（DC）を、問題ごとにランダムで選ぶ */
const CMDS = [
 {CMD:'このお花のブロックをママの手にのせてください', PART:'このお花のブロックをママの手に…', NEG:'このお花のブロックをママの手にのせなかったら', NEGK:'このお花のブロックをママの手にのせてくれなかったら', THX:'のせてくれて', THXDID:'のせてくれたこと'},
 {CMD:'このニンジンをお母さんの手の上にのせてください', PART:'このニンジンをお母さんの手の上に…', NEG:'このニンジンをお母さんの手の上にのせなかったら', NEGK:'このニンジンをお母さんの手の上にのせてくれなかったら', THX:'のせてくれて', THXDID:'のせてくれたこと'},
 {CMD:'この赤い車をこの道路の上においてください', PART:'この赤い車をこの道路の上に…', NEG:'この赤い車をこの道路の上におかなかったら', NEGK:'この赤い車をこの道路の上においてくれなかったら', THX:'おいてくれて', THXDID:'おいてくれたこと'}
];
let cmd = CMDS[0];
const subS = s => s.replace(/\{(CMD|PART|NEGK|NEG|THX|THXDID)\}/g,(m,k)=>cmd[k]);
const sub = q => JSON.parse(subS(JSON.stringify(q)));
let order, cur, res, phase, opts;
const app = document.getElementById('app');
const total = ids => ids.reduce((s,i)=>s+1+(QS[i].line?1:0),0);

function start(ids){
  order = ids || QS.map((_,i)=>i);
  cur = 0; res = order.map(()=>({pick:null,aOK:null,text:'',lOK:null,auto:null}));
  newQ();
}
function newQ(){
  cmd = CMDS[Math.random()*CMDS.length|0];
  const q = sub(QS[order[cur]]);
  opts = shuffle(q.act.map((t,i)=>({t,ok:i===0})));
  phase = 'action'; render();
}

function head(){
  const pct = Math.round(cur/order.length*100);
  const q = QS[order[cur]];
  return `<div class="row" style="justify-content:space-between"><span class="sub">${cur+1} / ${order.length} 問目（<a href="#" onclick="home();return false" style="color:inherit">最初の画面に戻る</a>）</span><span class="chip">フロー：${esc(q.node)}</span></div>
  <div class="progress"><i style="width:${pct}%"></i></div>`;
}

function render(){
  const q = sub(QS[order[cur]]), r = res[cur];
  let h = `<h1>PDI コーチング練習問題</h1>` + `<div class="card">${head()}<div class="scene">📍 ${esc(q.scene)}</div>`;
  h += `<div class="qlabel">① ${esc(q.qtext||'セラピストは次にどうする？')}（4択）</div>`;
  opts.forEach((o,i)=>{
    let cls='';
    if(r.pick!==null){ if(o.ok) cls='right'; else if(i===r.pick) cls='wrong'; }
    h += `<button class="choice ${cls}" ${r.pick!==null?'disabled':''} onclick="pick(${i})">${'ABCD'[i]}．${esc(o.t)}</button>`;
  });
  if(r.pick!==null){
    h += `<div class="verdict ${r.aOK?'ok':'ng'}">${r.aOK?'⭕ 正解！':'❌ 不正解'}</div><div class="box expl">${esc(q.actWhy)}</div>`;
    if(q.line){
      h += `<div class="qlabel">② そのときのコーチのセリフは？（自由記述）</div><div class="sub">${esc(q.line.ask)}</div>`;
      if(r.lOK===null){
        h += `<textarea id="ta" placeholder="ここにコーチのセリフを入力（○○ちゃんや課題の部分は自由でOK）">${esc(r.text)}</textarea>
        <div class="row" style="margin-top:10px"><button class="primary" onclick="submitLine()">回答する</button><button onclick="skipLine()">わからない</button><span class="sub hint-key">Ctrl+Enterでも回答できます</span></div>`;
      } else {
        h += lineResult(q,r);
      }
    }
    if(!q.line || r.lOK!==null){
      h += `<div class="row nav" style="margin-top:16px;justify-content:flex-end"><button class="primary" onclick="next()">${cur+1<order.length?'次の問題へ →':'結果を見る'}</button></div>`;
    }
  }
  h += `</div>`;
  app.innerHTML = h;
  const ta = document.getElementById('ta');
  if(ta){ ta.focus(); ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) submitLine(); }); }
}

function lineResult(q,r){
  const l = q.line, j = judgeLine(l, r.text);
  let h = `<div class="verdict ${r.lOK?'ok':'ng'}">${r.lOK?'⭕ セリフOK！':'❌ セリフ要確認'}${r.lOK!==r.auto?'（手動で変更）':''}</div>`;
  h += `<div class="box"><div class="sub">あなたの回答</div>${r.text?esc(r.text).replace(/\n/g,'<br>'):'<span class="sub">（未回答）</span>'}</div>`;
  h += `<ul class="pts">` + l.points.map((p,i)=>{
    const ok = j.hits[i]!==undefined ? j.hits[i] : true;
    return `<li>${ok?'✅':'⬜'} ${esc(p)}</li>`; }).join('') + `</ul>`;
  if(j.ng) h += `<div class="sub">⚠ 質問・提案の形や否定形が含まれています。</div>`;
  h += `<div class="box"><div class="sub">模範解答</div>${esc(l.model)}</div><div class="box expl"><div class="sub">解説</div>${esc(l.why)}</div>`;
  h += `<div class="sub" style="margin-top:8px">自動判定はキーワード照合です。言い換えが正しいと思う場合は、手動で切り替えられます。</div>
  <button onclick="toggleLine()" style="margin-top:6px">${r.lOK?'不正解にする':'自分の回答は合っていたので正解にする'}</button>`;
  return h;
}

function pick(i){ const r=res[cur]; r.pick=i; r.aOK=opts[i].ok; render(); }
function submitLine(){
  const r=res[cur], q=QS[order[cur]];
  r.text=document.getElementById('ta').value;
  r.auto = r.lOK = judgeLine(q.line, r.text).ok; render();
}
function skipLine(){ const r=res[cur]; r.text=''; r.auto=r.lOK=false; render(); }
function toggleLine(){ const r=res[cur]; r.lOK=!r.lOK; render(); }
function next(){ if(cur+1<order.length){cur++;newQ();window.scrollTo(0,0)} else finish(); }

/* ----- 結果 ----- */
function finish(){
  let got=0, max=0;
  order.forEach((qi,k)=>{ const q=QS[qi], r=res[k]; max++; if(r.aOK) got++; if(q.line){max++; if(r.lOK) got++;} });
  const pct = Math.round(got/max*100), pass = pct>=80;
  let h = `<h1>PDI コーチング練習問題</h1><div class="card"><div class="sub" style="text-align:center">結果</div>
  <div class="score" style="color:${pass?'var(--ok)':'var(--ink)'}">${pct}<span style="font-size:1.2rem">%</span></div>
  <div style="text-align:center">${got} / ${max} 点（4択＋セリフ）</div>
  <p style="text-align:center;font-weight:700">${pass?'🎉 合格ライン（80%）クリア！':'あと少し！80%以上で合格です。'}</p>
  <div class="row" style="justify-content:center">
    <button class="primary" onclick="start()">もう一度（全問）</button>
    <button onclick="home()">最初の画面（開始位置を選ぶ）</button>
    ${(()=>{const w=wrongIds();return w.length?`<button onclick="start(wrongIds())">間違えた問題だけ復習（${w.length}問）</button>`:''})()}
  </div></div>
  <div class="card"><b>問題ごとの結果</b><table><tr><th>#</th><th>場面</th><th>4択</th><th>セリフ</th></tr>`;
  order.forEach((qi,k)=>{ const q=QS[qi], r=res[k];
    h += `<tr><td>${k+1}</td><td>${esc(q.node)}</td><td class="${r.aOK?'mk-ok':'mk-ng'}">${r.aOK?'⭕':'❌'}</td><td class="${q.line?(r.lOK?'mk-ok':'mk-ng'):'mk-na'}">${q.line?(r.lOK?'⭕':'❌'):'—'}</td></tr>`; });
  h += `</table></div>`;
  app.innerHTML = h; window.scrollTo(0,0);
  if(pass){ document.getElementById('cmsg').textContent = `正答率 ${pct}%！PDIコーチングの流れがしっかり身についています。`; celebrate(); }
}
function wrongIds(){ return order.filter((qi,k)=>{const q=QS[qi],r=res[k];return !r.aOK||(q.line&&!r.lOK)}); }

/* ----- おめでとう演出 ----- */
let raf;
function celebrate(){
  document.getElementById('congrats').style.display='flex';
  const c=document.getElementById('over'); c.style.display='block';
  const x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#e94f4f','#f5a623','#f8e71c','#4caf50','#2d9cdb','#9b51e0','#ff7eb6'];
  const ps=Array.from({length:180},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,
    w:6+Math.random()*8,h:8+Math.random()*10,vy:2+Math.random()*4,vx:-1.5+Math.random()*3,
    r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function loop(t){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; if(p.y>c.height&&t-t0<6000){p.y=-10;p.x=Math.random()*c.width}
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(t-t0<9000) raf=requestAnimationFrame(loop); else stopConfetti();
  })(t0);
}
function stopConfetti(){ cancelAnimationFrame(raf); const c=document.getElementById('over'); c.style.display='none'; }
function closeCongrats(){ document.getElementById('congrats').style.display='none'; }

/* ----- スタート画面 ----- */
function home(){
  app.innerHTML = `<h1>PDI コーチング練習問題</h1>
  <div class="card"><p>PDIコーチング（LF・PS・親のリード・失敗の修正・はじめてのタイムアウトの椅子）で、<b>セラピスト（コーチ）がすること</b>と<b>コーチが言うセリフ</b>を確認する問題集です。</p>
  <ul>
   <li>各問題は <b>① 4択（コーチがすること／親の行動）</b> → <b>② コーチのセリフ（自由記述）</b> の2段階（各1点）。4択だけの問題もあります</li>
   <li>全 ${QS.length} 問（${QS.length+QS.filter(q=>q.line).length} 点満点）。コーチングの流れ順に進みます。<b>途中の場面から始める</b>こともできます</li>
   <li>答えのあとに模範解答と解説が出ます</li>
   <li><b>80%以上</b>で「おめでとう」演出が出ます 🎉</li>
  </ul>
  <p class="sub">用語：LF＝ラインフィーディング（セリフをそのまま与える）／PS＝プロンプティング（促しの言葉かけ）／CLP＝具体的賞賛／DC＝直接的命令。セリフは「○○ちゃん」の部分は自由で、キーワードで自動判定します。言い換えが正しいと思う時は手動で正解にできます。</p>
  <div class="qlabel">どこから始める？</div>
  <select id="from" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
    ${QS.map((q,i)=>`<option value="${i}">第${i+1}問｜${esc(q.node)}：${esc(subS(q.scene).length>26?subS(q.scene).slice(0,26)+'…':subS(q.scene))}</option>`).join('')}
    <option value="tricky">★ 間違いやすい問題だけ（${QS.filter(q=>q.node.startsWith('間違いやすい')).length}問）</option>
  </select>
  <label style="display:block;margin:10px 0"><input type="checkbox" id="rand"> 選んだ問題から最後まで（「間違いやすい問題だけ」のときは、その問題）を、ランダムな順番で出題する</label>
  <button class="primary" onclick="startHome()">スタート</button></div>`;
}
function startHome(){
  const v = document.getElementById('from').value;
  let ids = v==='tricky' ? QS.map((_,i)=>i).filter(i=>QS[i].node.startsWith('間違いやすい')) : QS.map((_,i)=>i).slice(+v);
  if(document.getElementById('rand').checked) ids = shuffle(ids);
  start(ids);
}
home();
</script>
</body>
</html>
